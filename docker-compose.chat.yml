# Deploy só da página do chat (hotel/creche) para o cliente.
# Uso: docker compose -f docker-compose.chat.yml up -d

services:
  chat:
    build:
      context: .
      dockerfile: Dockerfile.chat
      args:
        VITE_API_URL: ""
        VITE_API_KEY: ${API_KEY_N8N}
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - SERVE_CHAT_SPA=1
    restart: unless-stopped
